  <style>
    :root {
      --font-hero: 'Playfair Display', serif;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --bg-deep: #06090E;
      --bg-surface: rgba(18, 24, 38, 0.75);
      --bg-glass: rgba(255, 255, 255, 0.06);
      --border-glass: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(240, 109, 36, 0.45);
      --saffron: #F06D24;
      --saffron-gradient: linear-gradient(135deg, #FF7A00 0%, #E64A19 100%);
      --gold: #E5B842;
      --text-main: #FFFFFF;
      --text-muted: #9EABBE;
      --radius-dock: 100px;
      --radius-bento: 24px;
      --glow-shadow: 0 0 50px rgba(240, 109, 36, 0.25);
    }

    [data-theme="light"] {
      --bg-deep: #F7F5F0;
      --bg-surface: rgba(255, 255, 255, 0.88);
      --bg-glass: rgba(255, 255, 255, 0.7);
      --border-glass: rgba(0, 0, 0, 0.08);
      --border-glow: rgba(240, 109, 36, 0.3);
      --text-main: #0B1320;
      --text-muted: #586579;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ui);
      background-color: var(--bg-deep);
      color: var(--text-main);
      overflow-x: hidden;
      line-height: 1.6;
      transition: background-color 0.3s ease;
    }

    /* Floating Glass Dock Navbar */
    .dock-nav-container {
      position: fixed;
      top: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 9999;
      pointer-events: none;
    }
    .dock-nav {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--bg-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-dock);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .dock-nav::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: radial-gradient(160px circle at var(--mouse-x, -500px) var(--mouse-y, -500px), var(--border-glow), transparent 70%);
      z-index: -1;
      pointer-events: none;
    }
    .dock-logo {
      font-family: var(--font-hero);
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-main);
      padding: 0 12px;
      text-decoration: none;
      cursor: pointer;
    }
    .dock-logo span {
      background: var(--saffron-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dock-links { display: flex; list-style: none; gap: 4px; }
    .dock-links button {
      background: transparent;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .dock-links button:hover, .dock-links button.active {
      color: var(--text-main);
      background: var(--bg-glass);
    }
    .dock-links button.active {
      color: var(--saffron);
    }

    /* WebGL Hero Viewport */
    .hero-viewport {
      position: relative;
      width: 100vw;
      height: 90vh;
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #ripple-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hero-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(6, 9, 14, 0.25) 0%, rgba(6, 9, 14, 0.9) 90%);
      z-index: 2;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 900px;
      padding: 0 24px;
    }
    .hero-subtitle {
      font-size: 0.82rem;

      letter-spacing: 4px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 1rem;
      display: inline-block;
      padding: 6px 18px;
      border-radius: 100px;
      background: rgba(229, 184, 66, 0.1);
      border: 1px solid rgba(229, 184, 66, 0.3);
    }
    .hero-title {
      font-family: var(--font-hero);
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 1.8rem;
    }
    .hero-title span {
      background: linear-gradient(135deg, #FFF 20%, var(--gold) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Gooey Search Bar */
    .gooey-search-wrapper { max-width: 620px; margin: 0 auto; }
    .gooey-search {
      display: flex;
      align-items: center;
      background: rgba(18, 24, 38, 0.88);
      border: 1px solid var(--border-glass);
      border-radius: 100px;
      padding: 6px 8px 6px 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), var(--glow-shadow);
      transition: all 0.3s ease;
    }
    .gooey-search:focus-within {
      border-color: var(--saffron);
      box-shadow: 0 20px 45px rgba(240, 109, 36, 0.35);
      transform: translateY(-2px);
    }
    .gooey-search input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFF;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .radial-glow-btn {
      background: var(--saffron-gradient);
      border: none;
      color: #FFF;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 24px;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(240, 109, 36, 0.4);
      transition: transform 0.2s ease;
      font-family: inherit;
    }
    .radial-glow-btn:hover { transform: scale(1.03); }

    .magnetic-marquee {
      overflow: hidden;
      white-space: nowrap;
      background: rgba(240, 109, 36, 0.08);
      border-top: 1px solid rgba(240, 109, 36, 0.2);

      display: flex;

    }
    .marquee-item {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }
